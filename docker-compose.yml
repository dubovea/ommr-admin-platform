services:
  admin-backend:
    build:
      context: .
      dockerfile: apps/admin-backend/Dockerfile
    container_name: ommr-admin-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      BACKEND_PUBLIC_PORT: ${BACKEND_PORT:-4000}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-20mb}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required. Create root .env file.}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    command: >
      /bin/sh -c '
        echo "";
        echo "✅ Admin backend started:";
        echo "   http://localhost:$${BACKEND_PUBLIC_PORT}";
        echo "";
        echo "🏥 Health check:";
        echo "   http://localhost:$${BACKEND_PUBLIC_PORT}/health";
        echo "";
        echo "🔌 Admin API:";
        echo "   http://localhost:$${BACKEND_PUBLIC_PORT}/api/admin";
        echo "";
        yarn workspace @ommr/admin-backend start;
      '

  admin-frontend:
    build:
      context: .
      dockerfile: apps/admin-frontend/Dockerfile
      args:
        VITE_BACKEND_BASE_URL: ${VITE_BACKEND_BASE_URL:-/api/admin}
        VITE_REFINE_DEVTOOLS: ${VITE_REFINE_DEVTOOLS:-false}
        REFINE_NO_TELEMETRY: ${REFINE_NO_TELEMETRY:-true}
    container_name: ommr-admin-frontend
    restart: unless-stopped
    environment:
      NGINX_PORT: 80
      API_PROXY_PASS: http://admin-backend:4000
      FRONTEND_PUBLIC_PORT: ${FRONTEND_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - admin-backend
    command: >
      /bin/sh -c '
        echo "";
        echo "✅ Admin frontend started:";
        echo "   http://localhost:$${FRONTEND_PUBLIC_PORT}";
        echo "";
        echo "🔁 API proxy:";
        echo "   /api -> $${API_PROXY_PASS}";
        echo "";
        nginx -g "daemon off;";
      '