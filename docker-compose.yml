services:
  postgres:
    image: postgres:16-alpine
    container_name: ommr-admin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ommr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ommr_password}
      POSTGRES_DB: ${POSTGRES_DB:-ommr_admin}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ommr_admin_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: apps/admin-backend/Dockerfile
    container_name: ommr-admin-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-20mb}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:5174}
      DATABASE_URL: postgres://${POSTGRES_USER:-ommr}:${POSTGRES_PASSWORD:-ommr_password}@postgres:5432/${POSTGRES_DB:-ommr_admin}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    command: sh -c "yarn workspace @ommr/admin-backend db:push && yarn workspace @ommr/admin-backend start"

  frontend:
    build:
      context: .
      dockerfile: apps/admin-frontend/Dockerfile
      args:
        VITE_BACKEND_BASE_URL: ${VITE_BACKEND_BASE_URL:-/api/admin}
        VITE_REFINE_DEVTOOLS: ${VITE_REFINE_DEVTOOLS:-false}
        REFINE_NO_TELEMETRY: ${REFINE_NO_TELEMETRY:-true}
    container_name: ommr-admin-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NGINX_PORT: 80
      API_PROXY_PASS: http://backend:4000
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  ommr_admin_pg_data:
