services:
  admin-backend:
    build:
      context: .
      dockerfile: apps/admin-backend/Dockerfile
    container_name: ommr-admin-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-20mb}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required. Create root .env file.}
    ports:
      - "${BACKEND_PORT:-4000}:4000"

  admin-frontend:
    build:
      context: .
      dockerfile: apps/admin-frontend/Dockerfile
      args:
        VITE_BACKEND_BASE_URL: ${VITE_BACKEND_BASE_URL:-/api/admin}
        VITE_REFINE_DEVTOOLS: ${VITE_REFINE_DEVTOOLS:-false}
        REFINE_NO_TELEMETRY: ${REFINE_NO_TELEMETRY:-true}
    container_name: ommr-admin-frontend
    restart: unless-stopped
    environment:
      NGINX_PORT: 80
      API_PROXY_PASS: http://admin-backend:4000
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - admin-backend